<style>
    /* ── Mobile menu fixes ── */
    .main-navigation {
        position: relative;
    }

    .menu-toggle {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.75rem;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
    }

    .menu-icon {
        display: block;
        width: 25px;
        height: 3px;
        background-color: #222222;
        position: relative;
        transition: all 0.3s ease;
    }

    .menu-icon:before,
    .menu-icon:after {
        content: '';
        display: block;
        width: 100%;
        height: 3px;
        background-color: #222222;
        position: absolute;
        transition: all 0.3s ease;
    }

    .menu-icon:before { top: -8px; }
    .menu-icon:after  { bottom: -8px; }

    .menu-toggle.is-active .menu-icon {
        background-color: transparent;
    }

    .menu-toggle.is-active .menu-icon:before {
        transform: rotate(45deg);
        top: 0;
    }

    .menu-toggle.is-active .menu-icon:after {
        transform: rotate(-45deg);
        bottom: 0;
    }

    @media screen and (max-width: 768px) {
        .menu-toggle {
            display: flex;
        }

        .menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            min-width: 200px;
            flex-direction: column;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            z-index: 100;
        }

        .menu.is-active {
            display: flex;
        }
    }
</style>

<script>
    (function () {
        function initMenu() {
            var toggle = document.querySelector('.menu-toggle');
            var menu   = document.querySelector('.menu');
            if (!toggle || !menu) return;
            // Guard against double-binding if script runs more than once
            if (toggle.dataset.menuBound) return;
            toggle.dataset.menuBound = 'true';
            toggle.addEventListener('click', function () {
                var expanded = toggle.getAttribute('aria-expanded') === 'true';
                toggle.setAttribute('aria-expanded', !expanded);
                menu.classList.toggle('is-active');
                toggle.classList.toggle('is-active');
            });
        }
        // Run immediately (script is at top of injected HTML so DOM for
        // header elements below is not yet parsed — use DOMContentLoaded)
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMenu);
        } else {
            // Document already ready (e.g. loaded via createContextualFragment)
            initMenu();
        }
    })();
</script>
